# Curate: turn AnimeThemes sources into the five objects a question needs, then
# ingest them. Implements doc/GAME-DESIGN.md 5.2.
#
# WHAT CHANGED FROM THE VIDEO ERA
# This workflow used to transcode one ~1 MB VP9 clip per theme into a `clips`
# bucket and call ingest_question v1. All three of those are now wrong:
#   - No video is stored or served at all. doc/BLOCKERS.md B-20 measured that
#     5 of 10 sampled credit-free clips display the anime's title in Latin
#     script, so the clip spelled its own answer. A video window is contiguous,
#     so a title card at 0:12 cannot be excluded without losing the footage
#     around it. Stills are chosen independently and vetted one at a time.
#   - The bucket is `media`, limited to {audio/webm, image/jpeg}, 512 KB per
#     object (migration 0010). video/webm was removed outright, so the one
#     upload this design forbids is now impossible.
#   - Keys derive from asset_slug, never from the row id. rounds.question_id is
#     readable by every room member and create_room pre-inserts every round, so
#     id-derived keys on a public bucket would let a player prefetch all ten
#     rounds during round 1.
#
# WHY THE PER-THEME WORK IS A PYTHON SCRIPT
# tools/pipeline/curate_theme.py. The previous inline-bash version needed three
# separate bug fixes and every one was a shell subtlety, not a pipeline mistake.
# The work now involves per-theme medians, float timestamps and grouped sorting,
# which bash is bad at. This file only orchestrates: install, slice, loop,
# report.
#
# WHY IT RUNS IN CI AND NOT ON THE LAPTOP
# Source downloads are ~46.7 MB median (pipeline/manifest.json), and ffmpeg and
# tesseract are not installed on the dev machine at all. Actions has 2000 free
# minutes/month and throwaway bandwidth. Only the finished ~230 KB of stills and
# audio per theme crosses into Supabase.
#
# IDEMPOTENCY CONTRACT
# asset_slug is a fresh random uuid, deliberately NOT derived from basename:
# basename is public AnimeThemes data, so a derived slug could be recomputed for
# every title in the pool and the bucket is public-read. Retry safety instead
# comes from skipping any theme already present in question_bank, checked once
# per run before the loop. Combined with `concurrency: curate` that makes a
# re-run of a half-finished slice a no-op for the themes that landed.

name: curate

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Index of first theme to process (0-based, into the deduped theme list)"
        required: true
        default: "0"
      count:
        description: "How many themes to process this run (10-20 is a comfortable batch)"
        required: true
        default: "10"
      dry_run:
        description: "Build all five objects but write NOTHING to Supabase"
        type: boolean
        required: true
        default: true
      theme_types:
        description: "Which theme types to include. B-28 fallback: 0 of 4 sampled EDs leaked a title vs 5 of 6 OPs."
        type: choice
        required: true
        default: all
        options: [all, OP, ED]
      detail_pct:
        description: "Detail filter: reject frames below this % of the theme's median JPEG bytes (5.2.1 measured 45)"
        required: true
        default: "45"
      ocr_min_word:
        description: "Text filter: longest high-confidence word that rejects a frame. Measured over 647 frames: junk peaks at 3 chars, real titles reach 5+."
        required: true
        default: "5"
      ocr_min_conf:
        description: "Text filter: ignore OCR words below this confidence (0-100). Below ~70 the junk fragments swamp the signal."
        required: true
        default: "70"
      ocr_psm:
        description: "tesseract page segmentation mode. 11 = sparse text anywhere."
        required: true
        default: "11"
      ocr_dump:
        description: "Write out/ocr-<theme>.tsv with per-frame confidence metrics, for choosing thresholds from data"
        type: boolean
        required: true
        default: false

# Two concurrent runs would race the same question_bank pre-check and waste
# minutes. Queue them.
concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Not a secret: the project URL is public in any client bundle. Only the
      # service-role key is privileged.
      SUPABASE_URL: https://mxkqivivqultfuattuin.supabase.co
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ inputs.dry_run }}
      START: ${{ inputs.start }}
      COUNT: ${{ inputs.count }}
      THEME_TYPES: ${{ inputs.theme_types }}
      DETAIL_PCT: ${{ inputs.detail_pct }}
      OCR_MIN_WORD: ${{ inputs.ocr_min_word }}
      OCR_MIN_CONF: ${{ inputs.ocr_min_conf }}
      OCR_PSM: ${{ inputs.ocr_psm }}
      OCR_DUMP: ${{ inputs.ocr_dump }}
      # media bucket file_size_limit from migration 0010. Checked before upload
      # so an oversized object is reported with its real size instead of a bare
      # 413 from Storage.
      MAX_BYTES: "524288"
      OCR_LANGS: eng+jpn
      WORKDIR: work
      OUTDIR: out
      # Courtesy, not a workaround: a bare ranged GET to v.animethemes.moe was
      # verified to return 206 with no User-Agent at all. This just makes our
      # traffic identifiable to a free community service.
      UA: "GuessTheAnime-curate/1.0 (+https://github.com/Sayandeep1013/Rein-Bot)"

    steps:
      - uses: actions/checkout@v4

      # OCR is the only thing standing between an anime's title card and the
      # player (doc/BLOCKERS.md B-28), so its language packs are not optional.
      # jpn-vert was dropped after measurement: across 647 frames it produced
      # no high-confidence word, only junk and runtime.
      #
      # rapidocr runs as a second engine because tesseract is provably blind to
      # stylised display typography -- 3 of the 36 stills shipped by run
      # 32605150598 carried legible overlaid text that tesseract read nothing
      # from. Pinned <2 on purpose: the 1.x wheels bundle the .onnx weights,
      # while 2.x (renamed "rapidocr") downloads them on first use, which would
      # put a network fetch inside the frame loop. Constructing the engine here
      # verifies that claim in the cheap step rather than 20 minutes in.
      - name: Install ffmpeg, tesseract and rapidocr
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-jpn
          ffmpeg -version | head -1
          tesseract --version | head -1
          echo "languages:"
          tesseract --list-langs
          python3 -m pip install --quiet "rapidocr-onnxruntime<2"
          python3 -c "import rapidocr_onnxruntime as r; from rapidocr_onnxruntime import RapidOCR; RapidOCR(); print('rapidocr', getattr(r, '__version__', '?'), 'engine built, weights bundled')"

      - name: Guard inputs and secret
        run: |
          set -euo pipefail
          for v in START COUNT DETAIL_PCT OCR_MIN_WORD OCR_MIN_CONF OCR_PSM; do
            val="${!v}"
            if ! [[ "$val" =~ ^[0-9]+$ ]]; then
              echo "::error::$v must be a non-negative integer (got '$val')"; exit 1
            fi
          done
          if [ "$COUNT" -lt 1 ]; then echo "::error::count must be >= 1"; exit 1; fi
          if [ "$DETAIL_PCT" -gt 100 ]; then echo "::error::detail_pct must be <= 100"; exit 1; fi
          if [ "$OCR_MIN_CONF" -gt 100 ]; then
            echo "::error::ocr_min_conf is a 0-100 confidence, got $OCR_MIN_CONF"; exit 1
          fi
          if [ "$OCR_PSM" -gt 13 ]; then
            echo "::error::ocr_psm must be 0-13, got $OCR_PSM"; exit 1
          fi
          if [ "$OCR_MIN_WORD" -lt 2 ]; then
            echo "::error::ocr_min_word must be >= 2; 1 would reject every frame with a single stray glyph"; exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "${SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set, and this is not a dry run."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Flattens the nested manifest into one JSON object per theme (JSONL).
      # JSONL and not TSV because titles contain commas, colons and CJK, and a
      # delimiter-based format would need escaping rules that are easy to get
      # subtly wrong. Each line is almost the ingest payload already.
      - name: Build job list
        run: |
          set -euo pipefail

          # PowerShell's ConvertTo-Json has bitten this project before by
          # emitting a bare object where a one-element array was intended, which
          # silently undercounted themes. Fail loudly here rather than skip work.
          jq -e '[.items[] | select((.themes | type) != "array")] | length == 0' \
            pipeline/manifest.json > /dev/null \
            || { echo "::error::some items[].themes is not an array -- rebuild the manifest"; exit 1; }

          jq -c '
            .items[] as $a
            | $a.themes[]
            | {
                basename, link, overlap, resolution, size_bytes,
                nc, subbed, spoiler, nsfw,
                difficulty, theme_type, theme_sequence,
                anime_slug:   $a.slug,
                titles:       { romaji: $a.title_romaji, english: $a.title_english, native: $a.title_native },
                synonyms:     ($a.synonyms // []),
                anime_year:   $a.year,
                anime_season: $a.season,
                anime_format: $a.format
              }
          ' pipeline/manifest.json > flat.jsonl

          TOTAL=$(wc -l < flat.jsonl)
          DECLARED=$(jq -r '.theme_count' pipeline/manifest.json)
          echo "flattened $TOTAL themes (manifest declares $DECLARED)"
          if [ "$TOTAL" -ne "$DECLARED" ]; then
            echo "::error::manifest theme_count ($DECLARED) disagrees with actual themes ($TOTAL)"
            exit 1
          fi

          # nc/subbed/spoiler/nsfw are carried from the AnimeThemes API, never
          # asserted. question_bank's credit_free_only / not_subbed / sfw_only
          # CHECKs exist to stop an unsafe asset "even from a buggy ingest run";
          # if this workflow substituted literals those constraints would be
          # validating a constant. Anything unsafe is a manifest bug, so stop
          # before spending download and OCR minutes on it.
          BAD=$(jq -s '[.[] | select(.nc != true or .subbed != false or .spoiler != false or .nsfw != false)] | length' flat.jsonl)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD theme(s) carry unsafe flags -- these would be rejected by question_bank CHECKs"
            jq -c 'select(.nc != true or .subbed != false or .spoiler != false or .nsfw != false) | {basename, nc, subbed, spoiler, nsfw}' flat.jsonl
            exit 1
          fi

          # Dedupe to one theme per (anime_slug, theme_type, theme_sequence).
          #
          # WHY: gintama carries four manifest rows that collapse to two slots --
          # a 720p BD and a 540p DVD recap-series entry for each of OP1 and OP2.
          # Those are the same anime and the same song, so shipping both means
          # two rounds with an identical answer. Deduping also makes the tuple a
          # usable natural key, which is what the question_bank pre-check below
          # needs (basename would be the true key, but it is not a column).
          #
          # Tiebreak is HIGHEST RESOLUTION, then smallest size. doc/RESEARCH.md
          # 4.8 makes size the final tiebreak, but that precedence was written
          # when every source was re-encoded down to one 480p video: source
          # resolution affected nothing that shipped. Now the stills ARE the
          # product and OCR reliability is the load-bearing safety property
          # (B-28), and both improve with resolution. size stays as the second
          # key. This never overrides nc:true, which the assertion above has
          # already enforced for every row.
          jq -s -c '
            group_by(.anime_slug + "|" + .theme_type + "|" + ((.theme_sequence // "") | tostring))
            | map(sort_by([-(.resolution // 0), (.size_bytes // 0)])[0])
            | .[]
          ' flat.jsonl > deduped.jsonl

          DEDUPED=$(wc -l < deduped.jsonl)
          echo "deduped to $DEDUPED themes (dropped $((TOTAL - DEDUPED)) duplicate slot(s))"
          if [ "$TOTAL" -ne "$DEDUPED" ]; then
            echo "duplicate slots resolved:"
            jq -s -r '
              group_by(.anime_slug + "|" + .theme_type + "|" + ((.theme_sequence // "") | tostring))
              | map(select(length > 1))
              | .[] | sort_by([-(.resolution // 0), (.size_bytes // 0)])
              | "  \(.[0].anime_slug) \(.[0].theme_type)\(.[0].theme_sequence // ""): kept \(.[0].basename) (\(.[0].resolution)p), dropped \([.[1:][].basename] | join(", "))"
            ' flat.jsonl
          fi

          if [ "$THEME_TYPES" = "all" ]; then
            cp deduped.jsonl pool.jsonl
          else
            jq -c --arg t "$THEME_TYPES" 'select(.theme_type == $t)' deduped.jsonl > pool.jsonl
            echo "theme_types=$THEME_TYPES filter -> $(wc -l < pool.jsonl) theme(s)"
          fi

          POOL=$(wc -l < pool.jsonl)
          sed -n "$((START + 1)),$((START + COUNT))p" pool.jsonl > jobs.jsonl
          SLICE=$(wc -l < jobs.jsonl)
          echo "slice: start=$START count=$COUNT -> $SLICE job(s) of $POOL in pool"
          if [ "$SLICE" -eq 0 ]; then
            echo "::warning::slice is empty; start=$START is at or past the end ($POOL themes)"
          fi

      # One request, not one per theme. Idempotency for a retried batch: any
      # theme already in question_bank is skipped before its ~46.7 MB download.
      # service_role has SELECT on question_bank (verified live); no client role
      # does, which is why this needs the secret.
      - name: Fetch already-ingested themes
        run: |
          set -euo pipefail
          : > existing.keys
          if [ -z "${SERVICE_KEY:-}" ]; then
            echo "no service key (dry run): treating every theme as not yet ingested"
            exit 0
          fi
          code=$(curl -sS -o existing.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/question_bank?select=anime_slug,theme_type,theme_sequence&limit=2000" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "apikey: ${SERVICE_KEY}")
          if [ "$code" != "200" ]; then
            echo "::error::question_bank pre-check returned HTTP $code"
            head -c 300 existing.json; echo
            exit 1
          fi
          jq -r '.[] | "\(.anime_slug)|\(.theme_type)|\(.theme_sequence // "")"' \
            existing.json | sort -u > existing.keys
          echo "already ingested: $(wc -l < existing.keys) theme(s)"

      - name: Build objects, upload and ingest
        run: |
          # Deliberately NOT -e: one bad theme must not abort the batch.
          set -uo pipefail
          mkdir -p "$OUTDIR" "$WORKDIR"
          : > results.jsonl

          ok=0; failed=0; dry=0; skipped=0; already=0; processed=0

          # Reading on FD 3, not stdin. ffmpeg reads stdin when it is a pipe,
          # and with `done < jobs.jsonl` it once swallowed the remaining job
          # lines and fed them to its own command parser. curate_theme.py passes
          # -nostdin and closes stdin for every child, but FD 3 keeps the loop
          # safe from anything added here later.
          while IFS= read -r job <&3; do
            [ -z "$job" ] && continue

            basename=$(jq -r '.basename' <<< "$job")
            key=$(jq -r '"\(.anime_slug)|\(.theme_type)|\(.theme_sequence // "")"' <<< "$job")

            if grep -qxF "$key" existing.keys 2>/dev/null; then
              echo "already ingested, skipping: $basename"
              printf '{"basename":%s,"status":"ALREADY","note":"already in question_bank"}\n' \
                "$(jq -Rn --arg b "$basename" '$b')" >> results.jsonl
              already=$((already + 1))
              continue
            fi

            # Pace the AnimeThemes fetches. This sits at the TOP of the loop on
            # purpose: a pause at the bottom is unreachable exactly when it is
            # needed, because every error path uses `continue`. That is how an
            # earlier run pulled ~200 MB in two minutes and earned five
            # consecutive 5XXs. Guarded on `processed` so the first item does
            # not pay the cost.
            if [ "$processed" -gt 0 ]; then sleep 5; fi
            processed=$((processed + 1))

            echo "::group::${basename}"
            printf '%s' "$job" | python3 tools/pipeline/curate_theme.py > theme.json
            rc=$?
            if [ ! -s theme.json ]; then
              printf '{"basename":%s,"status":"FAIL","note":"script produced no result"}\n' \
                "$(jq -Rn --arg b "$basename" '$b')" > theme.json
            fi
            cat theme.json >> results.jsonl
            status=$(jq -r '.status // "FAIL"' theme.json)
            case "$status" in
              OK)      ok=$((ok + 1)) ;;
              DRY)     dry=$((dry + 1)) ;;
              SKIP)    skipped=$((skipped + 1)) ;;
              *)       failed=$((failed + 1))
                       echo "::error::$basename: $(jq -r '.note // "unknown"' theme.json)" ;;
            esac
            echo "rc=$rc status=$status"
            echo "::endgroup::"

            # The source is the only large file and it is useless once its five
            # objects exist. Runners have ~14 GB free; 136 x 46.7 MB would not
            # fit even if the batch never failed.
            rm -rf "${WORKDIR:?}"/*
          done 3< jobs.jsonl

          {
            echo "### curate: start=$START count=$COUNT dry_run=$DRY_RUN types=$THEME_TYPES"
            echo "detail_pct=$DETAIL_PCT ocr_min_word=$OCR_MIN_WORD ocr_min_conf=$OCR_MIN_CONF psm=$OCR_PSM langs=$OCR_LANGS rapidocr=${RAPIDOCR_ENABLE:-true}"
            echo
            echo "| result | count |"
            echo "| --- | --- |"
            echo "| ingested | $ok |"
            echo "| dry-run only | $dry |"
            echo "| skipped (too few clean stills) | $skipped |"
            echo "| already ingested | $already |"
            echo "| failed | $failed |"
            echo
            echo "| basename | status | stills | ts | poster | audio s | KB | clean/texty/dropped | note |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            jq -r '"| \(.basename // "?") | \(.status) | \(.still_count // 0) | \((.still_ts // []) | join(", ")) | \(.poster_source // "-") | \(.audio_seconds // 0) | \(((.bytes_total // 0) / 1024) | floor) | \(.ocr_clean // "-")/\(.ocr_texty // "-")/\(.detail_dropped // "-") | \(.note // "") |"' \
              results.jsonl
            echo
            echo "Total stored by this slice: $(jq -s '[.[] | select(.status == "OK") | .bytes_total] | add // 0 | . / 1048576 | .*10 | round / 10' results.jsonl) MB"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ok=$ok dry=$dry skipped=$skipped already=$already failed=$failed"
          # SKIP is a designed outcome (a sequence that yielded fewer than two
          # clean frames), so it must not fail the run. Only real errors do.
          [ "$failed" -eq 0 ]

      # Uploaded even when the job fails, because these frames ARE the evidence
      # for B-28 and a green run proves nothing by itself. out/stills holds
      # every image a player would see -- inspect all of them for a title, which
      # is an OCR false negative. out/rejected holds the text-positive frames,
      # which is how to confirm OCR caught the title cards at all rather than
      # merely not crashing.
      - name: Upload built objects and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curate-${{ inputs.start }}-${{ inputs.count }}-${{ inputs.theme_types }}
          path: |
            out/
            results.jsonl
            jobs.jsonl
          if-no-files-found: warn
          retention-days: 14
